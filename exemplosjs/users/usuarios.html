<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transmissão de Dados</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/vue@2"></script>
</head>
<body class="container bg-warning">
    <h1 class="mt-4">Usuários de Teste via REST</h1>
    <p>Dados obtidos gratuitamente através do serviço <a href="https://reqres.in/" target="_blank">reqres.in</a>.</p>

    <div id="usuarios" class="container-fluid">
        <div class="row">
            <div class="card col-md-3 p-2 m-3" v-for="(user, index) in users" :key="index">
                <img :src="user.avatar" class="card-img-top" alt="Avatar do Usuário">
                <div class="card-body">
                    <h5 class="card-title">{{user.first_name}} {{user.last_name}}</h5>
                    <p class="card-text">{{user.email}}</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        var app = new Vue({
            el: '#usuarios',
            data: {
                users: []
            },
            mounted() {
                this.loadUsers();
            },
            methods: {
                loadUsers() {
                    fetch('https://reqres.in/api/users?per_page=10')
                        .then(response => response.json())
                        .then(data => {
                            this.users = data.data;
                        })
                        .catch(error => {
                            console.error('Erro ao carregar os usuários:', error);
                        });
                }
            }
        });
    </script>
</body>
</html>
